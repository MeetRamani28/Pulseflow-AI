version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: pulseflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulseflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai-services:
    build: ./ai-services
    container_name: pulseflow-ai-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pulseflow
    env_file:
      - ./ai-services/.env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: pulseflow-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pulseflow
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-services:8000
      - FRONTEND_URL=http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-services:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: pulseflow-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000/api
      - VITE_SOCKET_URL=http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: